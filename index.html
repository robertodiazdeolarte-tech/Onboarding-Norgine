<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norgine · Onboarding · Plan de incorporación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
   ONBOARDING NORGINE — Estilos
   Estilo corporativo limpio, azul Norgine, mucho espacio en blanco
   ============================================================ */

    :root {
      --norgine-blue: #0066B3;
      --norgine-deep: #003D7A;
      --norgine-dark: #002850;
      --norgine-light: #E8F2FB;
      --norgine-soft: #F4F8FC;
      --norgine-gray: #5A6B7B;
      --norgine-line: #D9E4EF;
      --norgine-gold: #FFC53D;
      --bg: #FAFCFE;
      --ink: #0F1F33;
      --ink-soft: #5A6B7B;
      --shadow-card: 0 1px 2px rgba(0, 61, 122, 0.04), 0 8px 24px rgba(0, 61, 122, 0.07);
      --shadow-strong: 0 4px 12px rgba(0, 61, 122, 0.08), 0 24px 48px rgba(0, 61, 122, 0.12);
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
      --font-display: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ---------- TOP NAV ---------- */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid rgba(217, 228, 239, 0.6);
      transition: padding .25s ease;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--norgine-deep);
    }

    .nav-logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-logo .nav-divider {
      width: 1px;
      height: 22px;
      background: var(--norgine-line);
    }

    .nav-logo .nav-sub {
      font-size: 13px;
      color: var(--norgine-gray);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .nav-progress {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--norgine-gray);
    }

    .nav-progress-bar {
      width: 160px;
      height: 6px;
      background: var(--norgine-line);
      border-radius: 999px;
      overflow: hidden;
    }

    .nav-progress-fill {
      height: 100%;
      background: var(--norgine-blue);
      border-radius: 999px;
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }

    .nav-progress-text {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--norgine-deep);
    }

    .nav-reset {
      font-size: 12px;
      color: var(--norgine-gray);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--norgine-line);
      background: white;
      transition: all .2s;
    }

    .nav-reset:hover {
      border-color: var(--norgine-blue);
      color: var(--norgine-blue);
    }

    /* ---------- HOME (track selector) ---------- */
    .home {
      min-height: 100vh;
      padding: 120px 24px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 70% at 50% 0%, rgba(0, 102, 179, 0.10) 0%, transparent 60%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    }

    .home::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 61, 122, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 61, 122, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
      pointer-events: none;
    }

    .home-inner {
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .home h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(38px, 5.6vw, 72px);
      line-height: 1.04;
      letter-spacing: -0.035em;
      color: var(--norgine-dark);
      margin-bottom: 22px;
      animation: fadeUp .7s .1s ease both;
    }

    .home h1 em {
      font-style: normal;
      background: linear-gradient(120deg, var(--norgine-blue) 0%, #1B9DDC 60%, var(--norgine-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .home-lead {
      font-size: clamp(15px, 1.3vw, 18px);
      color: var(--norgine-gray);
      line-height: 1.55;
      max-width: 600px;
      margin: 0 auto 56px;
      animation: fadeUp .7s .2s ease both;
    }

    .home-question {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      margin-bottom: 28px;
      animation: fadeUp .7s .25s ease both;
    }

    .tracks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .track-card {
      position: relative;
      background: white;
      border: 1px solid var(--norgine-line);
      border-radius: var(--r-lg);
      padding: 32px 28px 28px;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      transition: all .35s cubic-bezier(.2, .8, .2, 1);
      box-shadow: var(--shadow-card);
      animation: fadeUp .7s ease both;
      display: flex;
      flex-direction: column;
    }

    .track-card:nth-child(1) {
      animation-delay: .35s;
    }

    .track-card:nth-child(2) {
      animation-delay: .45s;
    }

    .track-card:nth-child(3) {
      animation-delay: .55s;
    }

    .track-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--norgine-blue);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
    }

    .track-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-strong);
      border-color: rgba(0, 102, 179, 0.3);
    }

    .track-card:hover::before {
      transform: scaleX(1);
    }

    .track-card .track-icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--norgine-light);
      color: var(--norgine-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      transition: all .35s;
    }

    .track-card:hover .track-icon-wrap {
      background: var(--norgine-blue);
      color: white;
      transform: scale(1.05) rotate(-3deg);
    }

    .track-card .track-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--norgine-dark);
      letter-spacing: -0.025em;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .track-card .track-sub {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      margin-bottom: 16px;
    }

    .track-card .track-short {
      font-size: 14px;
      color: var(--norgine-gray);
      line-height: 1.55;
      flex: 1;
      margin-bottom: 24px;
    }

    .track-card .track-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid var(--norgine-line);
      font-size: 12px;
      color: var(--norgine-gray);
    }

    .track-card .track-meta .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--norgine-deep);
      background: var(--norgine-soft);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
    }

    .track-card .track-go {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--norgine-blue);
      font-weight: 600;
      font-size: 13px;
      transition: gap .25s;
    }

    .track-card:hover .track-go {
      gap: 10px;
    }

    /* Track-card progress mini */
    .track-card .track-progress {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--norgine-gray);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .track-card .track-progress-bar {
      flex: 1;
      height: 5px;
      background: var(--norgine-line);
      border-radius: 999px;
      overflow: hidden;
    }

    .track-card .track-progress-fill {
      height: 100%;
      background: var(--norgine-blue);
      border-radius: 999px;
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }

    .home-foot {
      margin-top: 60px;
      font-size: 12px;
      color: var(--norgine-gray);
      letter-spacing: 0.04em;
      animation: fadeUp .7s .65s ease both;
    }

    /* Back link in nav (when inside a track) */
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--norgine-deep);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--norgine-line);
      background: white;
      transition: all .2s;
      margin-right: 14px;
    }

    .nav-back:hover {
      border-color: var(--norgine-blue);
      color: var(--norgine-blue);
      transform: translateX(-2px);
    }

    @media (max-width: 900px) {
      .tracks {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .home {
        padding: 110px 18px 60px;
      }
    }

    /* ---------- HERO ---------- */
    .hero {
      min-height: 92vh;
      padding: 140px 40px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0, 102, 179, 0.08) 0%, transparent 60%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    }

    .hero::before {
      /* subtle grid texture */
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 61, 122, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 61, 122, 0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
      pointer-events: none;
    }

    .hero-inner {
      max-width: 1100px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--norgine-line);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--norgine-deep);
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(0, 61, 122, 0.05);
      animation: fadeUp .6s ease both;
    }

    .hero-eyebrow .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--norgine-blue);
      position: relative;
    }

    .hero-eyebrow .pulse::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--norgine-blue);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(.5);
        opacity: 1;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(40px, 6.4vw, 84px);
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: var(--norgine-dark);
      margin-bottom: 28px;
      animation: fadeUp .7s .1s ease both;
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(120deg, var(--norgine-blue) 0%, #1B9DDC 60%, var(--norgine-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.lead {
      font-size: clamp(16px, 1.4vw, 19px);
      line-height: 1.55;
      color: var(--norgine-gray);
      max-width: 620px;
      margin: 0 auto 36px;
      animation: fadeUp .7s .2s ease both;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--norgine-deep);
      color: white;
      padding: 16px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 28px rgba(0, 61, 122, 0.28);
      transition: all .3s cubic-bezier(.2, .8, .2, 1);
      animation: fadeUp .7s .3s ease both;
    }

    .hero-cta:hover {
      background: var(--norgine-blue);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0, 102, 179, 0.36);
    }

    .hero-cta svg {
      transition: transform .3s;
    }

    .hero-cta:hover svg {
      transform: translateY(3px);
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 64px;
      animation: fadeUp .7s .4s ease both;
    }

    .hero-stat {
      text-align: center;
    }

    .hero-stat .num {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 700;
      color: var(--norgine-deep);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .hero-stat .lbl {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--norgine-gray);
      margin-top: 4px;
    }

    .hero-stat-divider {
      width: 1px;
      background: var(--norgine-line);
    }

    /* ---------- JOURNEY (the path) ---------- */
    .journey {
      position: relative;
      padding: 80px 24px 160px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .journey-header {
      text-align: center;
      margin-bottom: 80px;
    }

    .journey-header .kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      margin-bottom: 14px;
    }

    .journey-header h2 {
      font-family: var(--font-display);
      font-size: clamp(28px, 3.4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--norgine-dark);
      margin-bottom: 12px;
    }

    .journey-header p {
      color: var(--norgine-gray);
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.55;
    }

    /* The svg path container */
    .path-wrap {
      position: relative;
      width: 100%;
    }

    .path-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .path-bg,
    .path-fill {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .path-bg {
      stroke: var(--norgine-line);
      stroke-dasharray: 2 10;
    }

    .path-fill {
      stroke: var(--norgine-blue);
      filter: drop-shadow(0 4px 10px rgba(0, 102, 179, 0.35));
      transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1);
    }

    /* The "walker" marker that travels the path */
    .walker {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--norgine-blue);
      box-shadow: 0 6px 18px rgba(0, 102, 179, 0.4), 0 0 0 6px rgba(0, 102, 179, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transform: translate(-50%, -50%);
      transition: top .6s cubic-bezier(.2, .8, .2, 1), left .6s cubic-bezier(.2, .8, .2, 1);
    }

    .walker::before {
      content: "";
      width: 12px;
      height: 12px;
      background: var(--norgine-blue);
      border-radius: 50%;
      animation: walkerPulse 1.6s ease-in-out infinite;
    }

    @keyframes walkerPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(.6);
      }
    }

    /* Day stops on the path */
    .stops {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 56px;
      column-gap: 40px;
    }

    .stop {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .stop.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    /* Alternate left/right alignment within columns */
    .stop.left {
      grid-column: 1;
      justify-content: flex-end;
      flex-direction: row-reverse;
      text-align: right;
    }

    .stop.right {
      grid-column: 2;
      justify-content: flex-start;
    }

    .stop.left .stop-card {
      text-align: left;
    }

    .stop.right .stop-card {
      text-align: left;
    }

    .stop-node {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid var(--norgine-line);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      flex-shrink: 0;
      cursor: pointer;
      transition: all .3s cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 2px 8px rgba(0, 61, 122, 0.06);
      z-index: 3;
    }

    .stop-node:hover {
      border-color: var(--norgine-blue);
      transform: scale(1.06);
      box-shadow: 0 8px 22px rgba(0, 102, 179, 0.25);
    }

    .stop-node .lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--norgine-gray);
      text-transform: uppercase;
    }

    .stop-node .num {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      color: var(--norgine-deep);
      line-height: 1;
      margin-top: 1px;
      letter-spacing: -0.02em;
    }

    .stop.completed .stop-node {
      background: var(--norgine-blue);
      border-color: var(--norgine-blue);
      box-shadow: 0 6px 18px rgba(0, 102, 179, 0.38);
    }

    .stop.completed .stop-node .lbl,
    .stop.completed .stop-node .num {
      color: white;
    }

    .stop.completed .stop-node::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid var(--norgine-blue);
      opacity: .25;
    }

    .stop.current .stop-node {
      border-color: var(--norgine-blue);
      background: white;
    }

    .stop.current .stop-node .num {
      color: var(--norgine-blue);
    }

    .stop.current .stop-node::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--norgine-blue);
      animation: ringPulse 1.8s ease-out infinite;
    }

    @keyframes ringPulse {
      0% {
        transform: scale(1);
        opacity: .8;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    /* Card next to each node */
    .stop-card {
      background: white;
      border: 1px solid var(--norgine-line);
      border-radius: var(--r-md);
      padding: 18px 20px;
      width: 320px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: all .3s cubic-bezier(.2, .8, .2, 1);
      position: relative;
    }

    .stop-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-strong);
      border-color: rgba(0, 102, 179, 0.3);
    }

    .stop-card .day-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--norgine-blue);

      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;

    .stop.completed .stop-card {
      background: linear-gradient(180deg, #F4F8FC 0%, white 100%);

      right: 16px;

      gap: 4px;

      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--norgine-blue);

    /* Day icon (left of card title) */
    .day-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--norgine-light);
      color: var(--norgine-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .stop.completed .day-icon {
      background: var(--norgine-blue);
      color: white;
    }

    /* Start & finish flags */
    .flag {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 16px 28px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      gap: 10px;
      box-shadow: var(--shadow-card);
    }

    .flag.start {
      background: white;
      color: var(--norgine-deep);
      border: 1px solid var(--norgine-line);
      width: fit-content;
      margin-bottom: 60px;
      position: relative;
      z-index: 3;
    }

    .flag.start .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--norgine-blue);
    }

    .flag.finish {
      background: linear-gradient(135deg, var(--norgine-deep) 0%, var(--norgine-blue) 100%);
      color: white;
      width: fit-content;
      margin-top: 60px;
      position: relative;
      z-index: 3;
      cursor: pointer;
      transition: all .3s;

    .flag.finish:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0, 102, 179, 0.4);
    }

    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 40, 80, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .panel-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(560px, 92vw);
      background: white;
      z-index: 101;
      transform: translateX(100%);
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -16px 0 60px rgba(0, 40, 80, 0.15);

    .panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--norgine-line);
      position: relative;
      background: linear-gradient(180deg, var(--norgine-soft) 0%, white 100%);

    .panel-close {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: white;
      border: 1px solid var(--norgine-line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--norgine-gray);
      transition: all .2s;
    }

    .panel-close:hover {
      color: var(--norgine-deep);
      border-color: var(--norgine-deep);
    }

    .panel-day-num {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      margin-bottom: 8px;
    }

    .panel h2 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--norgine-dark);
      line-height: 1.15;
      margin-bottom: 8px;
      padding-right: 50px;
    }

    .panel-area-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--norgine-deep);
      background: var(--norgine-light);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }

    .panel-summary {
      font-size: 15px;
      line-height: 1.55;
      color: var(--norgine-gray);
      padding-bottom: 24px;
      border-bottom: 1px dashed var(--norgine-line);
      margin-bottom: 24px;
    }

    .panel-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      margin-bottom: 16px;
    }

    .session {
      border: 1px solid var(--norgine-line);
      border-radius: var(--r-md);
      padding: 18px 20px;
      margin-bottom: 12px;
      background: white;
      position: relative;
      transition: border-color .2s;
    }

    .session:hover {
      border-color: rgba(0, 102, 179, 0.3);
    }

    .session-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .session h4 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--norgine-dark);
      letter-spacing: -0.01em;
      line-height: 1.3;

    .session-area-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--norgine-blue);
      background: var(--norgine-light);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;

    .session-owner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--norgine-deep);
      font-weight: 600;
      margin-bottom: 8px;

      height: 26px;

      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;

    .session-goal {

      line-height: 1.55;
      color: var(--norgine-gray);

      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all .25s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--norgine-deep);
      color: white;
    }

    .btn-primary:hover {
      background: var(--norgine-blue);
      transform: translateY(-1px);

    .btn-primary.completed {
      background: white;
      color: var(--norgine-deep);

    .btn-secondary {

      color: var(--norgine-gray);
      border-color: var(--norgine-line);

      border-color: var(--norgine-deep);
    }

      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;

      opacity: 1;

      justify-content: center;

      inset: -10px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      animation: spin 12s linear infinite;

    @keyframes spin {

      align-items: center;

      letter-spacing: -0.035em;
      color: white;
      line-height: 1.05;
      margin-bottom: 22px;

    .finish-content p {
      font-size: clamp(16px, 1.3vw, 19px);
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.55;
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .finish-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .finish-actions .btn-primary {
      background: white;
      color: var(--norgine-deep);
      padding: 16px 28px;
      font-size: 15px;
    }

    .finish-actions .btn-primary:hover {
      background: var(--norgine-gold);
      color: var(--norgine-dark);
    }

      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 16px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 999px;
    }

    .finish-actions .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Confetti pieces */
    .confetti {
      position: absolute;
      width: 10px;
      height: 14px;
      top: -20px;
      opacity: 0;
      animation: confettiFall 4s linear infinite;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ---------- FOOTER ---------- */
    .footer {
      text-align: center;
      padding: 60px 20px 40px;
      font-size: 12px;
      color: var(--norgine-gray);
      border-top: 1px solid var(--norgine-line);
      background: white;
    }

      margin-bottom: 14px;
      opacity: .8;
    }

    /* ---------- ANIMATION UTILS ---------- */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .nav {
        padding: 14px 18px;
      }

      .nav-progress-bar {

      }

      .nav-logo .nav-sub {
        display: none;
      }

      .hero {
        padding: 130px 20px 60px;
        min-height: auto;
      }

      .hero-stats {
        gap: 24px;
        margin-top: 44px;
      }

      .journey {
        padding: 60px 16px 100px;
      }

      .journey-header {
        margin-bottom: 50px;
      }

      .stops {
        grid-template-columns: 1fr;
        row-gap: 28px;
      }

      .stop.left,
      .stop.right {
        grid-column: 1;
        flex-direction: row;
        text-align: left;
        justify-content: flex-start;
      }

      .stop-card {
        width: 100%;
      }

      .path-svg {
        display: none;
      }

      .stops {
        border-left: 3px dashed var(--norgine-line);
        padding-left: 12px;
        margin-left: 30px;
      }

      .stop-node {
        margin-left: -45px;
      }

      .panel {
        width: 100vw;
      }

      .walker {
        display: none;
      }
    }
  </style>
</head>

  <script type="text/babel">
    /* global React, ReactDOM */
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const TRACKS = window.TRACKS;
    const STORAGE_PREFIX = "norgine-onboarding-progress-v2:"; // per-track key

    // ---------- Icons ----------
    const Icon = ({ name, size = 20 }) => {
      const s = { width: size, height: size, fill: "none", stroke: "currentColor", strokeWidth: 1.7, strokeLinecap: "round", strokeLinejoin: "round" };
      switch (name) {
        case "welcome": return <svg viewBox="0 0 24 24" {...s}><path d="M3 12l2-9h14l2 9" /><path d="M3 12v8h18v-8" /><path d="M9 16h6" /></svg>;
        case "team": return <svg viewBox="0 0 24 24" {...s}><circle cx="9" cy="8" r="3" /><circle cx="17" cy="9" r="2.2" /><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5" /><path d="M15 19c0-2 1.7-3.5 4-3.5s3 1.5 3 3.5" /></svg>;
        case "shield": return <svg viewBox="0 0 24 24" {...s}><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z" /><path d="M9 12l2 2 4-4" /></svg>;
        case "chart": return <svg viewBox="0 0 24 24" {...s}><path d="M3 3v18h18" /><path d="M7 14l4-4 3 3 5-6" /></svg>;
        case "medical": return <svg viewBox="0 0 24 24" {...s}><rect x="4" y="6" width="16" height="14" rx="2" /><path d="M9 6V4h6v2" /><path d="M12 10v6M9 13h6" /></svg>;
        case "product": return <svg viewBox="0 0 24 24" {...s}><path d="M21 7l-9 5-9-5 9-5 9 5z" /><path d="M3 12l9 5 9-5" /><path d="M3 17l9 5 9-5" /></svg>;
        case "event": return <svg viewBox="0 0 24 24" {...s}><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>;
        case "map": return <svg viewBox="0 0 24 24" {...s}><path d="M9 4l-6 2v14l6-2 6 2 6-2V4l-6 2-6-2z" /><path d="M9 4v14M15 6v14" /></svg>;
        case "field": return <svg viewBox="0 0 24 24" {...s}><circle cx="12" cy="9" r="3" /><path d="M12 2C7.5 2 5 5.5 5 9c0 5 7 13 7 13s7-8 7-13c0-3.5-2.5-7-7-7z" /></svg>;
        case "flag": return <svg viewBox="0 0 24 24" {...s}><path d="M5 21V4M5 4h12l-2 4 2 4H5" /></svg>;
        case "arrow-right": return <svg viewBox="0 0 24 24" {...s}><path d="M5 12h14M13 6l6 6-6 6" /></svg>;
        case "arrow-left": return <svg viewBox="0 0 24 24" {...s}><path d="M19 12H5M11 18l-6-6 6-6" /></svg>;
        case "arrow-down": return <svg viewBox="0 0 24 24" {...s}><path d="M12 5v14M6 13l6 6 6-6" /></svg>;
        case "check": return <svg viewBox="0 0 24 24" {...s}><path d="M5 12l5 5L20 7" /></svg>;
        case "close": return <svg viewBox="0 0 24 24" {...s}><path d="M6 6l12 12M18 6L6 18" /></svg>;
        case "trophy": return <svg viewBox="0 0 24 24" {...s} stroke="white" strokeWidth="2"><path d="M8 4h8v5a4 4 0 01-8 0V4z" /><path d="M8 6H5a3 3 0 003 3M16 6h3a3 3 0 01-3 3" /><path d="M10 14v4M14 14v4M8 20h8" /></svg>;
        case "sparkle": return <svg viewBox="0 0 24 24" {...s}><path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M5 19l4-4M15 9l4-4" /></svg>;
        case "home": return <svg viewBox="0 0 24 24" {...s}><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V11z" /></svg>;
        default: return null;
      }
    };

    const initials = (name) => {
      if (!name || name === "RRHH" || name === "Buddy") return name === "Buddy" ? "BD" : (name || "··").slice(0, 2).toUpperCase();
      const parts = name.split(/[\s·,/]+/).filter(Boolean);
      return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase();
    };

    // ---------- Persistence helpers ----------
    function loadCompleted(trackId) {
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + trackId);
        if (raw) return new Set(JSON.parse(raw));
      } catch (e) { }
      return new Set();
    }
    function saveCompleted(trackId, set) {
      try { localStorage.setItem(STORAGE_PREFIX + trackId, JSON.stringify(Array.from(set))); } catch (e) { }
    }

    // ---------- Path generation ----------
    function buildPath(positions) {
      if (positions.length < 2) return "";
      let d = `M ${positions[0].x} ${positions[0].y}`;
      for (let i = 1; i < positions.length; i++) {
        const prev = positions[i - 1];
        const cur = positions[i];
        const midY = (prev.y + cur.y) / 2;
        d += ` C ${prev.x} ${midY}, ${cur.x} ${midY}, ${cur.x} ${cur.y}`;
      }
      return d;
    }

    // ---------- Hash routing ----------
    function parseHash() {
      const h = (window.location.hash || "").replace(/^#\/?/, "").trim();
      if (!h) return { route: "home" };
      if (TRACKS[h]) return { route: "track", trackId: h };
      return { route: "home" };
    }
    function navigate(routeOrTrackId) {
      if (routeOrTrackId === "home") window.location.hash = "";
      else window.location.hash = "/" + routeOrTrackId;
    }

    // =====================================================================
    // HOME — Track selector
    // =====================================================================
    function Home({ onPick }) {
      const allProgress = useMemo(() => {
        const r = {};
        Object.values(TRACKS).forEach(t => { r[t.id] = loadCompleted(t.id).size; });
        return r;
      }, []);

      return (
        <section className="home" data-screen-label="00 Inicio">
          <div className="home-inner">
            <div className="hero-eyebrow" style={{ marginBottom: 28 }}>
              <span className="pulse"></span>
              Norgine · Plan de incorporación
            </div>
            <h1>Bienvenido/a.<br />Empieza tu <em>onboarding</em>.</h1>
            <p className="home-lead">
              Elige tu itinerario para ver el camino completo, día a día. Cada hito es una conversación,
              una formación o un día en el terreno.
            </p>
            <div className="home-question">¿A qué equipo perteneces?</div>

            <div className="tracks">
              {Object.values(TRACKS).map(t => {
                const total = t.days.length;
                const done = allProgress[t.id] || 0;
                const pct = total ? Math.round((done / total) * 100) : 0;
                return (
                  <button key={t.id} className="track-card" onClick={() => onPick(t.id)} aria-label={`Ir al onboarding de ${t.name}`}>
                    <div className="track-icon-wrap"><Icon name={t.icon} size={26} /></div>
                    <div className="track-name">{t.name}</div>
                    <div className="track-sub">{t.subtitle}</div>
                    <p className="track-short">{t.short}</p>
                    <div className="track-progress">
                      <span>{done}/{total}</span>
                      <div className="track-progress-bar">
                        <div className="track-progress-fill" style={{ width: pct + "%" }}></div>
                      </div>
                      <span>{pct}%</span>
                    </div>
                    <div className="track-meta">
                      <span className="pill">{total} días</span>
                      <span className="track-go">
                        {done > 0 ? "Continuar" : "Empezar"}
                        <Icon name="arrow-right" size={14} />
                      </span>
                    </div>
                  </button>
                );
              })}
            </div>

            <div className="home-foot">Norgine España · Uso interno</div>
          </div>
        </section>
      );
    }

    // =====================================================================
    // HERO (track-aware)
    // =====================================================================
    function Hero({ track, progress, onStart }) {
      const total = track.days.length;
      return (
        <section className="hero" data-screen-label="00 Hero">
          <div className="hero-inner">
            <div className="hero-eyebrow">
              <span className="pulse"></span>
              Onboarding · {track.name}
            </div>
            <h1>
              Tus primeros<br />
              <em>{total} días en Norgine</em>
            </h1>
            <p className="lead">
              {track.id === "ventas" && "Un camino guiado para que conozcas el equipo, los productos y tu zona. Cada hito es una conversación, una formación o un día en el terreno."}
              {track.id === "medico" && "Un camino guiado para que domines la evidencia científica, el pipeline y tu relación con HCPs. Cada hito es una sesión médica o un check-in."}
              {track.id === "oficina" && "Un onboarding ágil para que conozcas la compañía, los productos y tu equipo. Ocho días para integrarte con confianza."}
            </p>
            <button className="hero-cta" onClick={onStart}>
              {progress > 0 ? "Continuar el camino" : "Comenzar el camino"}
              <Icon name="arrow-down" size={18} />
            </button>
            <div className="hero-stats">
              <div className="hero-stat">
                <div className="num">{total}</div>
                <div className="lbl">Días</div>
              </div>
              <div className="hero-stat-divider"></div>
              <div className="hero-stat">
                <div className="num">{new Set(track.days.map(d => d.theme)).size}</div>
                <div className="lbl">Áreas</div>
              </div>
              <div className="hero-stat-divider"></div>
              <div className="hero-stat">
                <div className="num">{track.days.reduce((acc, d) => acc + d.sessions.length, 0)}</div>
                <div className="lbl">Sesiones</div>
              </div>
              <div className="hero-stat-divider"></div>
              <div className="hero-stat">
                <div className="num">{progress}/{total}</div>
                <div className="lbl">Completado</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // =====================================================================
    // JOURNEY (path + stops)
    // =====================================================================
    function Journey({ days, completed, currentDay, onOpen, onFinish }) {
      const wrapRef = useRef(null);
      const stopsRef = useRef(null);
      const [positions, setPositions] = useState([]);
      const [size, setSize] = useState({ w: 0, h: 0 });
      const TOTAL = days.length;

      const measure = useCallback(() => {
        if (!wrapRef.current || !stopsRef.current) return;
        const wrapRect = wrapRef.current.getBoundingClientRect();
        const nodes = stopsRef.current.querySelectorAll(".stop-node");
        const pos = [];
        nodes.forEach(n => {
          const r = n.getBoundingClientRect();
          pos.push({
            x: r.left - wrapRect.left + r.width / 2,
            y: r.top - wrapRect.top + r.height / 2,
          });
        });
        setPositions(pos);
        setSize({ w: wrapRect.width, h: wrapRect.height });
      }, []);

      useEffect(() => {
        measure();
        const ro = new ResizeObserver(measure);
        if (wrapRef.current) ro.observe(wrapRef.current);
        window.addEventListener("resize", measure);
        return () => { ro.disconnect(); window.removeEventListener("resize", measure); };
      }, [measure, days]);

      useEffect(() => {
        if (!stopsRef.current) return;
        const stopsEls = stopsRef.current.querySelectorAll(".stop");
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) e.target.classList.add("in-view");
          });
        }, { threshold: 0.2, rootMargin: "0px 0px -10% 0px" });
        stopsEls.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, [days]);

      const fullPathD = useMemo(() => buildPath(positions), [positions]);
      const pathRef = useRef(null);
      const [pathLen, setPathLen] = useState(0);
      useEffect(() => {
        if (pathRef.current) {
          try { setPathLen(pathRef.current.getTotalLength()); } catch (e) { }
        }
      }, [fullPathD]);

      const walkerPos = useMemo(() => {
        if (!positions.length) return null;
        const idx = Math.min(currentDay - 1, positions.length - 1);
        return positions[Math.max(0, idx)];
      }, [positions, currentDay]);

      const fillRatio = Math.min(1, completed.size / TOTAL + 0.001);
      const dashOffset = pathLen ? pathLen * (1 - fillRatio) : pathLen;

      return (
        <section className="journey" id="journey" data-screen-label="01 Camino">
          <div className="journey-header">
            <div className="kicker">El camino</div>
            <h2>Tu recorrido, día a día</h2>
            <p>Avanza por los hitos, abre cada parada y márcala como completada cuando termines.</p>
          </div>

          <div className="flag start">
            <span className="dot"></span>
            Día 1 · Empieza tu camino
          </div>

          <div className="path-wrap" ref={wrapRef}>
            {size.w > 0 && positions.length > 1 && (
              <svg className="path-svg" width={size.w} height={size.h} viewBox={`0 0 ${size.w} ${size.h}`} preserveAspectRatio="none">
                <path className="path-bg" d={fullPathD} />
                <path
                  ref={pathRef}
                  className="path-fill"
                  d={fullPathD}
                  strokeDasharray={pathLen || 1}
                  strokeDashoffset={dashOffset}
                />
              </svg>
            )}

            {walkerPos && (
              <div className="walker" style={{ left: walkerPos.x, top: walkerPos.y }} aria-hidden="true"></div>
            )}

            <div className="stops" ref={stopsRef}>
              {days.map((day, i) => {
                const isLeft = i % 2 === 0;
                const isCompleted = completed.has(day.n);
                const isCurrent = !isCompleted && day.n === currentDay;
                return (
                  <div
                    key={day.n}
                    className={`stop ${isLeft ? "left" : "right"} ${isCompleted ? "completed" : ""} ${isCurrent ? "current" : ""}`}
                    data-screen-label={`Día ${String(day.n).padStart(2, "0")}`}
                  >
                    <button className="stop-node" onClick={() => onOpen(day.n)} aria-label={`Día ${day.n}: ${day.title}`}>
                      {isCompleted ? (
                        <Icon name="check" size={22} />
                      ) : (
                        <>
                          <span className="lbl">Día</span>
                          <span className="num">{day.n}</span>
                        </>
                      )}
                    </button>
                    <div className="stop-card" onClick={() => onOpen(day.n)}>
                      <div className="day-icon"><Icon name={day.icon} size={18} /></div>
                      <div className="day-tag">
                        <span className="dot"></span>
                        Día {String(day.n).padStart(2, "0")} · {day.theme}
                      </div>
                      <h3>{day.title}</h3>
                      <p>{day.summary}</p>
                      <div className="area-row">
                        <span className="area">{day.area}</span>
                        <span className="open-arrow">
                          Ver detalle
                          <Icon name="arrow-right" size={14} />
                        </span>
                      </div>
                      {isCompleted && (
                        <span className="completed-stamp">
                          <Icon name="check" size={12} /> Completado
                        </span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <button className="flag finish" onClick={onFinish}>
            <Icon name="trophy" size={18} />
            Llegada · Listo para tu día a día
          </button>
        </section>
      );
    }

    // =====================================================================
    // DETAIL PANEL
    // =====================================================================
    function DetailPanel({ day, total, isOpen, isCompleted, onClose, onToggle, onPrev, onNext }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => {
          if (e.key === "Escape") onClose();
          if (e.key === "ArrowLeft") onPrev();
          if (e.key === "ArrowRight") onNext();
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [isOpen, onClose, onPrev, onNext]);

      return (
        <>
          <div className={`panel-overlay ${isOpen ? "open" : ""}`} onClick={onClose}></div>
          <aside className={`panel ${isOpen ? "open" : ""}`} aria-hidden={!isOpen}>
            {day && (
              <>
                <div className="panel-header">
                  <button className="panel-close" onClick={onClose} aria-label="Cerrar"><Icon name="close" size={16} /></button>
                  <div className="panel-day-num">
                    Día {String(day.n).padStart(2, "0")} de {total}
                  </div>
                  <h2>{day.title}</h2>
                  <div style={{ marginTop: 12 }}>
                    <span className="panel-area-tag">{day.theme}</span>
                  </div>
                </div>
                <div className="panel-body">
                  <p className="panel-summary">{day.summary}</p>
                  <div className="panel-section-title">Sesiones del día · {day.sessions.length}</div>
                  {day.sessions.map((s, i) => (
                    <div className="session" key={i}>
                      <div className="session-header">
                        <h4>{s.title}</h4>
                        <span className="session-area-pill">{s.area}</span>
                      </div>
                      <div className="session-owner">
                        <span className="avatar">{initials(s.owner)}</span>
                        {s.owner}
                      </div>
                      <p className="session-goal">{s.goal}</p>
                    </div>
                  ))}
                </div>
                <div className="panel-footer">
                  <button className="btn btn-secondary" onClick={onPrev} disabled={day.n === 1}>
                    <Icon name="arrow-left" size={14} />
                    Anterior
                  </button>
                  <button className={`btn btn-primary ${isCompleted ? "completed" : ""}`} onClick={() => onToggle(day.n)}>
                    {isCompleted ? (<><Icon name="check" size={14} /> Completado</>) : "Marcar como completado"}
                  </button>
                  <button className="btn btn-secondary" onClick={onNext} disabled={day.n === total}>
                    Siguiente
                    <Icon name="arrow-right" size={14} />
                  </button>
                </div>
              </>
            )}
          </aside>
        </>
      );
    }

    // =====================================================================
    // FINISH
    // =====================================================================
    function FinishScreen({ open, track, onClose, onReset, onHome }) {
      const [pieces] = useState(() => Array.from({ length: 60 }, (_, i) => ({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 4,
        duration: 3 + Math.random() * 3,
        color: ["#0066B3", "#003D7A", "#FFC53D", "#1B9DDC", "#FFFFFF"][i % 5],
        rot: Math.random() * 360,
      })));
      const total = track ? track.days.length : 0;
      return (
        <div className={`finish-screen ${open ? "open" : ""}`} role="dialog" aria-hidden={!open}>
          <div className="grid-bg"></div>
          {open && pieces.map(p => (
            <div key={p.id} className="confetti" style={{
              left: `${p.left}%`,
              background: p.color,
              animationDelay: `${p.delay}s`,
              animationDuration: `${p.duration}s`,
              transform: `rotate(${p.rot}deg)`,
            }}></div>
          ))}
          <div className="finish-content">
            <div className="finish-eyebrow">
              <Icon name="sparkle" size={14} /> Onboarding completado <Icon name="sparkle" size={14} />
            </div>
            <div className="finish-medal"><Icon name="trophy" size={48} /></div>
            <h1>¡Enhorabuena!<br />{track && track.id === "ventas" ? "Estás listo para salir a la calle." : "Estás listo/a para tu día a día."}</h1>
            <p>
              Has completado tus {total} días de onboarding en Norgine. Conoces al equipo, dominas
              tu ámbito y entiendes el mercado. Ahora empieza lo bueno.
            </p>
            <div className="finish-actions">
              <button className="btn-primary" onClick={onClose}>Volver al camino</button>
              <button className="btn-ghost" onClick={onHome}>Ir al inicio</button>
              <button className="btn-ghost" onClick={onReset}>Reiniciar</button>
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // TRACK VIEW (one full onboarding flow)
    // =====================================================================
    function TrackView({ track, onHome }) {
      const TOTAL = track.days.length;
      const [completed, setCompleted] = useState(() => loadCompleted(track.id));
      const [openDayN, setOpenDayN] = useState(null);
      const [finishOpen, setFinishOpen] = useState(false);

      useEffect(() => { saveCompleted(track.id, completed); }, [completed, track.id]);

      // Reload completion if track changes
      useEffect(() => {
        setCompleted(loadCompleted(track.id));
        setOpenDayN(null);
        setFinishOpen(false);
        window.scrollTo({ top: 0, behavior: "auto" });
      }, [track.id]);

      const currentDay = useMemo(() => {
        for (let i = 1; i <= TOTAL; i++) if (!completed.has(i)) return i;
        return TOTAL;
      }, [completed, TOTAL]);

      const progress = completed.size;

      const openDay = (n) => setOpenDayN(n);
      const closePanel = () => setOpenDayN(null);

      const toggleComplete = (n) => {
        setCompleted(prev => {
          const next = new Set(prev);
          if (next.has(n)) next.delete(n); else next.add(n);
          if (next.size === TOTAL && !prev.has(n)) {
            setTimeout(() => { setOpenDayN(null); setFinishOpen(true); }, 600);
          }
          return next;
        });
      };

      const goPrev = () => { if (openDayN > 1) setOpenDayN(openDayN - 1); };
      const goNext = () => { if (openDayN < TOTAL) setOpenDayN(openDayN + 1); };

      const reset = () => {
        setCompleted(new Set());
        setFinishOpen(false);
        try { localStorage.removeItem(STORAGE_PREFIX + track.id); } catch (e) { }
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const scrollToJourney = () => {
        document.getElementById("journey")?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const showFinish = () => {
        if (completed.size === TOTAL) setFinishOpen(true);
        else openDay(currentDay);
      };

      const openDay_obj = openDayN ? track.days.find(d => d.n === openDayN) : null;

      return (
        <>
          <nav className="nav">
            <div className="nav-logo">
              <button className="nav-back" onClick={onHome} aria-label="Volver al inicio">
                <Icon name="arrow-left" size={14} /> Inicio
              </button>
              <img src={window.NORGINE_LOGO} alt="Norgine" />
              <span className="nav-divider"></span>
              <span className="nav-sub">Onboarding · {track.name}</span>
            </div>
            <div className="nav-progress">
              <span className="nav-progress-text">{progress}/{TOTAL}</span>
              <div className="nav-progress-bar">
                <div className="nav-progress-fill" style={{ width: `${(progress / TOTAL) * 100}%` }}></div>
              </div>
              {progress > 0 && (
                <button className="nav-reset" onClick={reset} title="Reiniciar">Reiniciar</button>
              )}
            </div>
          </nav>

          <Hero track={track} progress={progress} onStart={scrollToJourney} />

          <Journey
            days={track.days}
            completed={completed}
            currentDay={currentDay}
            onOpen={openDay}
            onFinish={showFinish}
          />

          <DetailPanel
            day={openDay_obj}
            total={TOTAL}
            isOpen={!!openDayN}
            isCompleted={openDayN ? completed.has(openDayN) : false}
            onClose={closePanel}
            onToggle={toggleComplete}
            onPrev={goPrev}
            onNext={goNext}
          />

          <FinishScreen
            open={finishOpen}
            track={track}
            onClose={() => setFinishOpen(false)}
            onReset={reset}
            onHome={onHome}
          />

          <footer className="footer">
            <div>Norgine · Agenda de Onboarding · {track.subtitle} · Uso interno</div>
          </footer>
        </>
      );
    }

    // =====================================================================
    // HOME WRAPPER (with nav)
    // =====================================================================
    function HomeView({ onPick }) {
      return (
        <>
          <nav className="nav">
            <div className="nav-logo">
              <img src={window.NORGINE_LOGO} alt="Norgine" />
              <span className="nav-divider"></span>
              <span className="nav-sub">Plan de incorporación</span>
            </div>
          </nav>
          <Home onPick={onPick} />
        </>
      );
    }

    // =====================================================================
    // APP — Router
    // =====================================================================
    function App() {
      const [route, setRoute] = useState(() => parseHash());

      useEffect(() => {
        const onChange = () => setRoute(parseHash());
        window.addEventListener("hashchange", onChange);
        return () => window.removeEventListener("hashchange", onChange);
      }, []);

      const goTrack = (trackId) => navigate(trackId);
      const goHome = () => navigate("home");

      if (route.route === "track" && TRACKS[route.trackId]) {
        return <TrackView key={route.trackId} track={TRACKS[route.trackId]} onHome={goHome} />;
      }
      return <HomeView onPick={goTrack} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
